name: Patch loader navigation bridge

on:
  push:
    paths:
      - .github/workflows/patch-loader-navigation.yml

permissions:
  contents: write

jobs:
  patch-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load access control inside the application scope
        run: |
          python - <<'PY'
          from pathlib import Path

          loader_path = Path("loader.js")
          cloud_path = Path("cloud.js")
          loader = loader_path.read_text()
          cloud = cloud_path.read_text()
          changes = 0

          guard = '  if (typeof configureRemoteClient === "function") return;\n\n'
          if guard in cloud:
              cloud = cloud.replace(guard, "", 1)
              changes += 1

          runtime = '  eval(await (await fetch("cloud.js?v=12")).text());\n  eval(await (await fetch("cloud-navigation.js?v=6")).text());\n'
          if runtime not in loader:
              closing = '})();'
              position = loader.rfind(closing)
              if position < 0:
                  raise SystemExit("Could not locate loader runtime closing")
              loader = loader[:position] + '\n' + runtime + loader[position:]
              changes += 1

          if changes == 0:
              raise SystemExit("The scoped runtime was already installed")
          loader_path.write_text(loader)
          cloud_path.write_text(cloud)
          print(f"Applied {changes} scoped runtime change(s)")
          PY
      - name: Commit scoped runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loader.js cloud.js
          git commit -m "Install scoped access runtime"
          git push

# One-time trigger: compact scoped runtime

name: Deploy ImoFlow v17

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/patch-loader-navigation.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ImoFlow v17 runtime patch
        run: |
          cat .github/imoflow-runtime-patch-0.b64 .github/imoflow-runtime-patch-1.b64 | base64 -d | gzip -dc > /tmp/runtime.patch
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const loader = fs.readFileSync('loader.js', 'utf8');
          const payloads = [...loader.matchAll(/eval\(await imoflowInflate\("([A-Za-z0-9+/=]+)"\)\);/g)];
          if (payloads.length < 2) throw new Error('Application payload not found');
          fs.writeFileSync('/tmp/combined-old.js', zlib.gunzipSync(Buffer.from(payloads[1][1], 'base64')));
          NODE
          (cd /tmp && patch combined-old.js < runtime.patch)
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          let loader = fs.readFileSync('loader.js', 'utf8');
          const payload = zlib.gzipSync(fs.readFileSync('/tmp/combined-old.js'), { level: 9, mtime: 0 }).toString('base64');
          let position = 0;
          loader = loader.replace(/eval\(await imoflowInflate\("([A-Za-z0-9+/=]+)"\)\);/g, full => {
            position += 1;
            return position === 2 ? `eval(await imoflowInflate("${payload}"));` : full;
          });
          fs.writeFileSync('loader.js', loader);
          const index = fs.readFileSync('index.html', 'utf8').replace(/loader\.js\?v=\d+/, 'loader.js?v=17');
          fs.writeFileSync('index.html', index);
          NODE
      - name: Commit deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loader.js index.html
          git diff --cached --quiet || git commit -m 'Deploy ImoFlow v17 login logo fix'
          git push

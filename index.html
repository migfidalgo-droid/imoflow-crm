        const navigation = document.getElementById("navList");

    <style>
      .money-input-wrap {
        position: relative;
        display: block;
        width: 100%;
        height: 40px;
        min-height: 40px;
        font-size: inherit;
        line-height: 1;
      }

      .money-input-wrap input {
        box-sizing: border-box;
        display: block;
        font-size: 14px;
        line-height: normal;
        width: 100%;
        height: 40px;
        min-height: 40px;
        padding-right: 42px;
      }

      .money-input-wrap::after {
        content: "€";
        position: absolute;
        top: 50%;
        right: 14px;
        transform: translateY(-50%);
        color: #536170;
        font-size: 14px;
        font-weight: 800;
        line-height: 1;
        pointer-events: none;
      }

      .field.money-field {
        align-content: start;
      }

      .owner-progressive-field > select[data-owner-source-select],
      .owner-progressive-field > .muted {
        display: none;
      }

      .owner-progressive-picker {
        display: grid;
        gap: 10px;
        width: 100%;
      }

      .owner-progressive-row {
        display: grid;
        gap: 6px;
      }

      .owner-progressive-row label {
        color: #536170;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .owner-combo {
        position: relative;
        width: 100%;
      }

      .owner-combo-button {
        align-items: center;
        background: #ffffff;
        border: 1px solid #d4dbe6;
        border-radius: 8px;
        color: #1f2937;
        cursor: pointer;
        display: flex;
        font-size: 14px;
        font-weight: 600;
        height: 40px;
        justify-content: space-between;
        padding: 0 12px;
        text-align: left;
        width: 100%;
      }

      .owner-combo-button::after {
        color: #536170;
        content: "⌄";
        font-size: 16px;
        font-weight: 800;
      }

      .owner-combo-button.is-empty {
        color: #7b8794;
        font-weight: 500;
      }

      .owner-combo-panel {
        background: #ffffff;
        border: 1px solid #d4dbe6;
        border-radius: 8px;
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.14);
        left: 0;
        margin-top: 6px;
        max-height: 260px;
        overflow: hidden;
        padding: 8px;
        position: absolute;
        right: 0;
        top: 100%;
        z-index: 70;
      }

      .owner-combo-panel[hidden] {
        display: none;
      }

      .owner-combo-search {
        box-sizing: border-box;
        height: 38px;
        margin-bottom: 8px;
        width: 100%;
      }

      .owner-combo-list {
        display: grid;
        gap: 4px;
        max-height: 194px;
        overflow-y: auto;
      }

      .owner-combo-option {
        background: transparent;
        border: 0;
        border-radius: 6px;
        color: #1f2937;
        cursor: pointer;
        font-size: 14px;
        min-height: 34px;
        padding: 8px 10px;
        text-align: left;
        width: 100%;
      }

      .owner-combo-option:hover,
      .owner-combo-option.is-selected {
        background: #eaf1fb;
        color: #0d3d70;
      }

      .owner-combo-empty {
        color: #7b8794;
        font-size: 13px;
        padding: 8px 10px;
      }

      .owner-more-toggle {
        align-items: center;
        color: #536170;
        display: flex;
        font-size: 13px;
        font-weight: 700;
        gap: 8px;
        min-height: 30px;
      }

      .owner-more-toggle input {
        height: 16px;
        min-height: 16px;
        width: 16px;
      }

      .property-documents-area {
        display: block;
      }

      .property-document-columns {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
      }

      .property-document-section {
        background: #f4f8fd;
        border: 1px solid #d7e3f2;
        border-radius: 8px;
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .property-document-section-header {
        align-items: start;
        display: flex;
        gap: 12px;
        justify-content: space-between;
      }

      .property-document-section-header h3 {
        color: #0b3b75;
        font-size: 15px;
        margin: 0 0 3px;
      }

      .property-document-section-header span {
        color: #687286;
        font-size: 12px;
        font-weight: 700;
      }

      .property-doc-upload-button {
        align-items: center;
        cursor: pointer;
        display: inline-flex;
        flex: 0 0 auto;
        justify-content: center;
        line-height: 1;
        margin: 0;
        min-height: 38px;
        padding-bottom: 0;
        padding-top: 0;
      }

      .property-doc-upload-button span {
        align-items: center;
        display: inline-flex;
        min-height: 38px;
      }

      .property-doc-upload-button input {
        display: none;
      }

      .property-doc-hint {
        margin: -4px 0 0;
      }

      .attached-doc .row-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
      }

      @media (max-width: 900px) {
        .property-document-columns {
          grid-template-columns: 1fr;
        }

        .property-document-section-header {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>

        const excludedMoneyNames = /percentage|sharePercentage|duration|area|year/i;
        const moneyLabelPattern = /(valor|preço|comissão fixa|honorários|nossos honorários|contra-proposta)/i;
        const excludedLabelPattern = /(percentagem|percentual|%|tipo de comissão|prazo|área|ano)/i;

        function fieldLabel(input) {
          const field = input.closest(".field") || input.closest("label") || input.parentElement;
          return field ? field.innerText || "" : "";
        }

        function isMoneyInput(input) {
          const name = input.getAttribute("name") || "";
          const id = input.id || "";
          const label = fieldLabel(input);
          if (input.type !== "number") return false;
          if (excludedMoneyNames.test(`${name} ${id}`)) return false;
          if (excludedLabelPattern.test(label)) return false;
          return moneyNames.has(name) || moneyLabelPattern.test(label);
        }

        function enhanceMoneyInputs(root = document) {
          root.querySelectorAll("input:not([data-money-enhanced])").forEach(input => {
            if (!isMoneyInput(input)) return;
            input.dataset.moneyEnhanced = "true";
            const field = input.closest(".field");
            if (field) field.classList.add("money-field");
            if (input.parentElement?.classList.contains("money-input-wrap")) return;
            const wrapper = document.createElement("span");
            wrapper.className = "money-input-wrap";
            input.parentNode.insertBefore(wrapper, input);
            wrapper.appendChild(input);
          });
        }

        const observer = new MutationObserver(() => enhanceMoneyInputs());
        document.addEventListener("DOMContentLoaded", () => {
          enhanceMoneyInputs();
          observer.observe(document.body, { childList: true, subtree: true });
        });
        window.addEventListener("load", () => enhanceMoneyInputs());
      })();
    </script>
    <script>
      (() => {
        function parseMoneyValue(value) {
          if (!value) return 0;
          const normalized = String(value)
            .replace(/[^\d,.-]/g, "")
            .replace(/\.(?=\d{3}(?:\D|$))/g, "")
            .replace(",", ".");
          const number = Number(normalized);
          return Number.isFinite(number) ? number : 0;
        }

        function formatEuroValue(value) {
          if (!value) return "";
          return new Intl.NumberFormat("pt-PT", {
            style: "currency",
            currency: "EUR",
            maximumFractionDigits: 0,
          }).format(value);
        }

        function refreshPropertyCommission(root = document) {
          root.querySelectorAll('[name="commissionMode"]').forEach(mode => {
            const container = mode.closest("form") || mode.closest('[role="dialog"]') || document;
            const price = container.querySelector('[name="price"]');
            const fixedValue = container.querySelector('[name="commissionFixedValue"]');
            const percentage = container.querySelector('[name="commissionPercentage"]');
            const commission = container.querySelector('[name="commission"]');
            if (!price || !fixedValue || !percentage || !commission) return;

            const modeValue = mode.value || "";
            let nextValue = "";
            if (/percentagem/i.test(modeValue)) {
              const priceNumber = parseMoneyValue(price.value);
              const percentageNumber = parseMoneyValue(percentage.value);
              nextValue = priceNumber && percentageNumber ? formatEuroValue(priceNumber * percentageNumber / 100) : "";
            } else if (/fixo/i.test(modeValue)) {
              nextValue = formatEuroValue(parseMoneyValue(fixedValue.value));
            }

            if (commission.value !== nextValue) {
              commission.value = nextValue;
              commission.dispatchEvent(new Event("input", { bubbles: true }));
              commission.dispatchEvent(new Event("change", { bubbles: true }));
            }
          });
        }

        function bindPropertyCommission(root = document) {
          root.querySelectorAll('[name="price"], [name="commissionMode"], [name="commissionFixedValue"], [name="commissionPercentage"]').forEach(input => {
            if (input.dataset.commissionCalcReady === "true") return;
            input.dataset.commissionCalcReady = "true";
            input.addEventListener("input", () => refreshPropertyCommission());
            input.addEventListener("change", () => refreshPropertyCommission());
          });
        }

        function hideDocumentStatusFields(root = document) {
          root.querySelectorAll('[name="documentsStatus"]').forEach(input => {
            const field = input.closest(".field") || input.closest("label") || input.parentElement;
            if (field) field.classList.add("is-hidden");
          });
        }

        function refreshPropertyMediationExtras(root = document) {
          bindPropertyCommission(root);
          refreshPropertyCommission(root);
          hideDocumentStatusFields(root);
        }

        const observer = new MutationObserver(() => refreshPropertyMediationExtras());
        document.addEventListener("DOMContentLoaded", () => {
          refreshPropertyMediationExtras();
          observer.observe(document.body, { childList: true, subtree: true });
        });
        document.addEventListener("click", event => {
          if (event.target.closest("button")) refreshPropertyMediationExtras();
        }, true);
        window.addEventListener("load", () => refreshPropertyMediationExtras());
      })();
    </script>
    <script>
      (() => {
        function syncMediationContractDates(root = document) {
          root.querySelectorAll('[name="mediationContractDate"]').forEach(contractDate => {
            const container = contractDate.closest("form") || contractDate.closest('[role="dialog"]') || document;
            const mandateStart = container.querySelector('[name="mandateStart"]');
            if (!mandateStart) return;

            if (!contractDate.value && mandateStart.value) {
              contractDate.value = mandateStart.value;
            }

            if (contractDate.value && mandateStart.value !== contractDate.value) {
              mandateStart.value = contractDate.value;
              mandateStart.dispatchEvent(new Event("input", { bubbles: true }));
              mandateStart.dispatchEvent(new Event("change", { bubbles: true }));
            }

            if (contractDate.dataset.mediationSyncReady === "true") return;
            contractDate.dataset.mediationSyncReady = "true";
            contractDate.addEventListener("input", () => syncMediationContractDates(container));
            contractDate.addEventListener("change", () => syncMediationContractDates(container));
          });
        }

        function hideMandateStartFields(root = document) {
          root.querySelectorAll('[name="mandateStart"]').forEach(input => {
            const field = input.closest(".field") || input.closest("label") || input.parentElement;
            if (field) field.classList.add("is-hidden");
          });
        }

        function reorderMediationFields(root = document) {
          root.querySelectorAll('[name="mediationContractDate"]').forEach(contractDate => {
            const container = contractDate.closest("form") || contractDate.closest('[role="dialog"]') || document;
            const mandateType = container.querySelector('[name="mandateType"]');
            const mandateTypeField = mandateType?.closest(".field") || mandateType?.closest("label");
            const contractDateField = contractDate.closest(".field") || contractDate.closest("label");
            if (!mandateTypeField || !contractDateField) return;
            if (mandateTypeField.nextElementSibling !== contractDateField) {
              mandateTypeField.insertAdjacentElement("afterend", contractDateField);
            }
          });
        }

        function refreshMediationFields(root = document) {
          syncMediationContractDates(root);
          hideMandateStartFields(root);
          reorderMediationFields(root);
        }

        const observer = new MutationObserver(() => refreshMediationFields());
        document.addEventListener("DOMContentLoaded", () => {
          refreshMediationFields();
          observer.observe(document.body, { childList: true, subtree: true });
        });
        document.addEventListener("click", event => {
          if (event.target.closest("button")) refreshMediationFields();
        }, true);
        document.addEventListener("submit", () => refreshMediationFields(), true);
        window.addEventListener("load", () => refreshMediationFields());
      })();
    </script>
    <script>
      (() => {
        function ownerOrdinal(index) {
          return `${index + 1}.º proprietário`;
        }

        function uniqueValues(values, allowedValues) {
          const seen = new Set();
          return values.filter(value => {
            if (!value || seen.has(value) || !allowedValues.has(value)) return false;
            seen.add(value);
            return true;
          });
        }

        function normalizeText(value) {
          return String(value || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim()
            .toLowerCase();
        }

        function transformOwnerSelect(source) {
          if (source.dataset.ownerProgressiveReady === "true") return;
          const field = source.closest(".field");
          if (!field) return;

          source.dataset.ownerProgressiveReady = "true";
          source.dataset.ownerSourceSelect = "true";
          source.dataset.originalName = source.getAttribute("name") || "ownerIds";
          source.removeAttribute("name");
          field.classList.add("owner-progressive-field");

          const options = Array.from(source.options)
            .filter(option => option.value)
            .map(option => ({ value: option.value, label: option.textContent.trim() || option.value }));
          const allowedValues = new Set(options.map(option => option.value));
          let selectedValues = uniqueValues(Array.from(source.selectedOptions).map(option => option.value), allowedValues);
          if (!selectedValues.length) selectedValues = [""];

          const picker = document.createElement("div");
          picker.className = "owner-progressive-picker";
          source.insertAdjacentElement("afterend", picker);

          const hiddenInputs = document.createElement("div");
          hiddenInputs.hidden = true;
          picker.insertAdjacentElement("afterend", hiddenInputs);

          function syncHiddenInputs() {
            const cleanValues = uniqueValues(selectedValues, allowedValues);
            hiddenInputs.innerHTML = "";
            Array.from(source.options).forEach(option => {
              option.selected = cleanValues.includes(option.value);
            });
            cleanValues.forEach(value => {
              const hidden = document.createElement("input");
              hidden.type = "hidden";
              hidden.name = source.dataset.originalName || "ownerIds";
              hidden.value = value;
              hiddenInputs.appendChild(hidden);
            });
          }

          function closeOwnerCombos(exceptCombo) {
            picker.querySelectorAll(".owner-combo").forEach(combo => {
              if (combo === exceptCombo) return;
              combo.querySelector(".owner-combo-panel")?.setAttribute("hidden", "");
              combo.querySelector(".owner-combo-button")?.setAttribute("aria-expanded", "false");
            });
          }

          function renderOwnerOptions(list, searchInput, currentValue, index) {
            const query = normalizeText(searchInput.value);
            const filteredOptions = options.filter(optionData => {
              const alreadySelected = selectedValues.some((selectedValue, selectedIndex) => (
                selectedIndex !== index && selectedValue === optionData.value
              ));
              return !alreadySelected && normalizeText(optionData.label).includes(query);
            });

            list.innerHTML = "";
            if (!filteredOptions.length) {
              const empty = document.createElement("div");
              empty.className = "owner-combo-empty";
              empty.textContent = options.length ? "Sem resultados" : "Sem vendedores/senhorios disponíveis";
              list.appendChild(empty);
              return;
            }

            filteredOptions.forEach(optionData => {
              const option = document.createElement("button");
              option.type = "button";
              option.className = "owner-combo-option";
              if (optionData.value === currentValue) option.classList.add("is-selected");
              option.textContent = optionData.label;
              option.addEventListener("click", event => {
                event.stopPropagation();
                selectedValues[index] = optionData.value;
                selectedValues = selectedValues.slice(0, index + 1);
                render();
              });
              list.appendChild(option);
            });
          }

          function render() {
            const cleanNonEmpty = uniqueValues(selectedValues, allowedValues);
            selectedValues = selectedValues.map(value => allowedValues.has(value) ? value : "");
            if (!selectedValues.length) selectedValues = [""];

            picker.innerHTML = "";
            selectedValues.forEach((value, index) => {
              const row = document.createElement("div");
              row.className = "owner-progressive-row";

              const rowLabel = document.createElement("label");
              rowLabel.textContent = ownerOrdinal(index);

              const selectedOption = options.find(option => option.value === value);
              const combo = document.createElement("div");
              combo.className = "owner-combo";

              const button = document.createElement("button");
              button.type = "button";
              button.className = selectedOption ? "owner-combo-button" : "owner-combo-button is-empty";
              button.dataset.ownerRowSelect = "true";
              button.setAttribute("aria-expanded", "false");
              button.textContent = selectedOption?.label || (options.length ? "Selecionar proprietário" : "Sem vendedores/senhorios disponíveis");

              const panel = document.createElement("div");
              panel.className = "owner-combo-panel";
              panel.hidden = true;

              const searchInput = document.createElement("input");
              searchInput.className = "owner-combo-search";
              searchInput.type = "search";
              searchInput.placeholder = "Pesquisar proprietário";

              const list = document.createElement("div");
              list.className = "owner-combo-list";

              button.addEventListener("click", event => {
                event.stopPropagation();
                const willOpen = panel.hidden;
                closeOwnerCombos(combo);
                panel.hidden = !willOpen;
                button.setAttribute("aria-expanded", willOpen ? "true" : "false");
                if (willOpen) {
                  searchInput.value = "";
                  renderOwnerOptions(list, searchInput, value, index);
                  setTimeout(() => searchInput.focus(), 0);
                }
              });

              searchInput.addEventListener("click", event => event.stopPropagation());
              searchInput.addEventListener("input", () => renderOwnerOptions(list, searchInput, value, index));
              panel.addEventListener("click", event => event.stopPropagation());

              renderOwnerOptions(list, searchInput, value, index);
              panel.append(searchInput, list);
              combo.append(button, panel);
              row.append(rowLabel, combo);
              picker.appendChild(row);

              const maxOwnerRows = Math.max(options.length, 2);
              const canAskForMore = Boolean(value) && index + 1 < maxOwnerRows;
              if (!canAskForMore) return;

              const toggleLabel = document.createElement("label");
              toggleLabel.className = "owner-more-toggle";
              const checkbox = document.createElement("input");
              checkbox.type = "checkbox";
              checkbox.checked = selectedValues.length > index + 1;
              checkbox.addEventListener("change", () => {
                selectedValues = selectedValues.slice(0, index + 1);
                if (checkbox.checked) selectedValues.push("");
                render();
              });
              const toggleText = document.createElement("span");
              toggleText.textContent = "O imóvel tem mais algum proprietário?";
              toggleLabel.append(checkbox, toggleText);
              picker.appendChild(toggleLabel);
            });

            syncHiddenInputs();
          }

          document.addEventListener("click", event => {
            if (!picker.isConnected) return;
            if (!event.target.closest(".owner-combo")) closeOwnerCombos();
          }, true);

          render();
        }

        function refreshOwnerSelectors(root = document) {
          root.querySelectorAll('select[name="ownerIds"]').forEach(transformOwnerSelect);
        }

        const observer = new MutationObserver(() => refreshOwnerSelectors());
        document.addEventListener("DOMContentLoaded", () => {
          refreshOwnerSelectors();
          observer.observe(document.body, { childList: true, subtree: true });
        });
        document.addEventListener("click", event => {
          if (event.target.closest("button")) requestAnimationFrame(() => refreshOwnerSelectors());
        }, true);
        window.addEventListener("load", () => refreshOwnerSelectors());
      })();
    </script>
  </body>
</html>

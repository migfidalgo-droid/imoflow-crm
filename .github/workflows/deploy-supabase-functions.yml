name: Deploy Supabase Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: rmadcturzoswyydiibey
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: RE/MAX Power - ImoFlow <notificacoes@imoflow.pt>
      EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop if deployment secrets are missing
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY is not configured."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure function secrets
        run: |
          supabase secrets set \
            RESEND_API_KEY="$RESEND_API_KEY" \
            EMAIL_FROM="$EMAIL_FROM" \
            --project-ref "$SUPABASE_PROJECT_ID"
          if [ -n "$EMAIL_REPLY_TO" ]; then
            supabase secrets set \
              EMAIL_REPLY_TO="$EMAIL_REPLY_TO" \
              --project-ref "$SUPABASE_PROJECT_ID"
          fi

      - name: Deploy functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

name: Patch loader navigation bridge

on:
  push:
    paths:
      - .github/workflows/patch-loader-navigation.yml

permissions:
  contents: write

jobs:
  patch-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load synchronized navigation runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("loader.js")
          loader = path.read_text()
          old = 'cloud-navigation.js?v=6'
          new = 'cloud-navigation.js?v=7'
          if old not in loader:
              raise SystemExit("Navigation runtime version was already updated")
          path.write_text(loader.replace(old, new, 1))
          PY
      - name: Commit runtime version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loader.js
          git commit -m "Load synchronized navigation runtime"
          git push

# One-time trigger: synchronized navigation runtime
